name: Deploy Frontend to Vercel

# 백엔드(deploy.yml)가 Railway CLI + RAILWAY_TOKEN으로 GitHub App 없이 배포하는 것과 동일한 방식.
# Vercel GitHub App(조직 레포 접근 권한 필요)을 아예 안 쓰고, CLI + 토큰만으로 배포해서
# 레포 접근 권한 승인을 기다릴 필요가 없음
on:
  push:
    branches:
      - fe/dev # 지금 작업 브랜치. main으로 머지되면 이 값을 main으로 바꿔주면 됨

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      # .vercel/project.json이 .gitignore에 있어서 레포엔 없음 - VERCEL_ORG_ID/PROJECT_ID
      # 환경변수로 대신 링크시킴
      - name: Pull Vercel Project Settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
